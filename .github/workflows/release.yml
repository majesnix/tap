name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release name
        # src/lib/release.ts is the single source of the milestone name shown in
        # the app footer; the GitHub release title carries it too.
        run: |
          NAME=$(sed -n 's/.*RELEASE_NAME = "\(.*\)".*/\1/p' src/lib/release.ts)
          echo "RELEASE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Release name: $NAME"

      - name: Import Apple Developer Certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      - name: Verify Certificate
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" || true)
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Signing identity: $CERT_ID"

      - name: Build Tauri app (universal macOS)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Tap v__VERSION__ · ${{ env.RELEASE_NAME }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Updater artifacts need the signing key, so only the release workflow requests them.
          args: --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Verify Gatekeeper (notarization check)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" | head -1)
          echo "Verifying: $APP"
          spctl --assess --type exec --verbose "$APP"

  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release name
        # src/lib/release.ts is the single source of the milestone name shown in
        # the app footer; the GitHub release title carries it too.
        run: |
          NAME=$(sed -n 's/.*RELEASE_NAME = "\(.*\)".*/\1/p' src/lib/release.ts)
          echo "RELEASE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Release name: $NAME"

      - name: Build Tauri app (Linux x86_64)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Tap v__VERSION__ · ${{ env.RELEASE_NAME }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'

  build-arch:
    runs-on: ubuntu-22.04
    needs: build-linux
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build prerequisites (Arch)
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git \
            sudo \
            rust \
            nodejs \
            pnpm \
            webkit2gtk-4.1 \
            gtk3 \
            libappindicator-gtk3 \
            librsvg \
            openssl \
            pkgconf \
            patchelf \
            github-cli

      - name: Create unprivileged build user
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Mark workspace as safe for git (container)
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Stage source for builder user
        run: |
          mkdir -p /home/builder/build
          cp -r . /home/builder/build/tap
          chown -R builder:builder /home/builder

      - name: Build Arch package (.pkg.tar.zst)
        run: |
          cd /home/builder/build/tap/packaging/arch
          sudo -u builder env \
            SRC_DIR=/home/builder/build/tap \
            HOME=/home/builder \
            makepkg -f --noconfirm --skipchecksums
          ls -la *.pkg.tar.zst

      - name: Upload .pkg.tar.zst to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd /home/builder/build/tap/packaging/arch
          PKG=$(ls *.pkg.tar.zst | head -1)
          echo "Uploading $PKG to release $TAG"
          gh release upload "$TAG" "$PKG" --clobber --repo "${{ github.repository }}"

      - name: Upload artifact (always)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tap-arch-pkg
          path: /home/builder/build/tap/packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
