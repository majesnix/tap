name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Dependabot auto-merges are performed with the workflow's GITHUB_TOKEN, and
  # pushes made with that token do not trigger `push` workflows. Without this
  # schedule, main can sit unverified for weeks after a run of bot merges.
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    # RabbitMQ broker for the Rust integration tests (TAP_INTEGRATION=1).
    # NOTE: service containers start before checkout, so the repo's
    # docker/definitions.json cannot be volume-mounted here. The topology is
    # imported via the Management API in a dedicated step below instead.
    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: dev
          RABBITMQ_DEFAULT_PASS: dev
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov and cargo-audit
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-llvm-cov,cargo-audit

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit npm production dependencies
        # Development-only advisories (jsdom, the shadcn CLI, ...) never ship in
        # the bundle; the production tree must stay clean at high and above.
        run: pnpm audit --prod --audit-level=high

      - name: Audit Rust dependencies
        # Unmaintained notices (gtk-rs GTK3 bindings used by Tauri on Linux) are
        # warnings and do not fail the step. RUSTSEC-2026-0194/0195 (quick-xml)
        # arrive through tauri -> plist, which pins quick-xml 0.39; drop the
        # ignores once plist moves to quick-xml >= 0.41.
        run: |
          cargo audit -f src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

      - name: Run frontend tests with coverage
        run: pnpm exec vitest run --coverage --reporter=verbose

      - name: Type-check frontend
        run: pnpm build

      - name: Lint frontend
        run: pnpm lint

      - name: Import RabbitMQ topology
        # Service containers can't mount ./docker/definitions.json, so import it via
        # the Management API once the broker is reachable. This creates the queues,
        # exchanges, and bindings the integration tests assert on.
        run: |
          for i in $(seq 1 30); do
            if curl -sf -u dev:dev http://localhost:15672/api/overview >/dev/null; then
              echo "Management API is up"
              break
            fi
            echo "Waiting for RabbitMQ Management API ($i)..."
            sleep 2
          done
          curl -sf -u dev:dev -H "content-type: application/json" \
            -X POST http://localhost:15672/api/definitions \
            --data @docker/definitions.json
          echo "Imported topology:"
          curl -sf -u dev:dev http://localhost:15672/api/queues/%2F \
            | grep -o '"name":"[^"]*"' || true

      - name: "Run Rust tests with coverage (gate: region >= 80%)"
        # TAP_INTEGRATION=1 makes broker-backed tests fail loudly if the broker is
        # unreachable (rather than silently skipping). Wiring files that no test can
        # cover (lib.rs/main.rs Tauri bootstrap, test_support.rs) are excluded.
        env:
          TAP_INTEGRATION: "1"
        run: |
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml \
            --ignore-filename-regex '(lib\.rs|main\.rs|test_support\.rs)$' \
            --fail-under-regions 80

      - name: Run Clippy (Rust linter)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  build-windows:
    # Tap is documented as cross-platform but was never built on Windows in CI.
    # Introduced as non-blocking; set continue-on-error to false after the first green run.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build and unit-test backend (broker tests skip without a broker)
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml
