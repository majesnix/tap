<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span aria-hidden="true" style="display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;width:{{ size }}px;height:{{ size }}px;line-height:0;">{{ svg }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;24px&quot;,&quot;height&quot;:&quot;24px&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;send&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:16,&quot;tsType&quot;:&quot;number&quot;}}">
const cache = {};
class Component extends DCLogic {
  state = { markup: null };
  load() {
    const name = this.props.icon ?? "send";
    if (cache[name]) { this.setState({ markup: cache[name] }); return; }
    fetch(new URL(`icons/${name}.svg`, document.baseURI).href)
      .then(r => r.ok ? r.text() : "")
      .then(t => { cache[name] = t; if (!this.unmounted) this.setState({ markup: t }); })
      .catch(() => {});
  }
  componentDidMount() { this.load(); }
  componentDidUpdate(prev) { if (prev.icon !== this.props.icon) this.load(); }
  componentWillUnmount() { this.unmounted = true; }
  renderVals() {
    const size = Number(this.props.size ?? 16);
    const m = this.state.markup;
    const svg = m ? React.createElement("span", {
      style: { display: "inline-flex", width: size, height: size },
      dangerouslySetInnerHTML: { __html: m.replace(/<!--[\s\S]*?-->/g, "").replace(/width="[^"]*"/, `width="${size}"`).replace(/height="[^"]*"/, `height="${size}"`) }
    }) : null;
    return { svg, size };
  }
}
</script>
</body>
</html>
